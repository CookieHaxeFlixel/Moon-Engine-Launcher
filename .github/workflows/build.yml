name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  VCPKG_COMMIT: 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
  NDK_VERSION: "26.1.10909125"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone vcpkg
        shell: cmd
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          git checkout %VCPKG_COMMIT%
          call bootstrap-vcpkg.bat

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_binary_cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}

      - name: Configure
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg_binary_cache,readwrite
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg_binary_cache,readwrite
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonLauncher-windows
          path: |
            build/Release/MoonLauncher.exe
            build/Release/*.dll
            versions.json
            assets/**

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
          cd ~/vcpkg
          git checkout "$VCPKG_COMMIT"
          ./bootstrap-vcpkg.sh

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-android-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.NDK_VERSION }}

      - name: Configure native library
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build native library
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite
        run: cmake --build build-android

      - name: Stage jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build-android/libmain.so android/app/src/main/jniLibs/arm64-v8a/
          cp build-android/vcpkg_installed/arm64-android/lib/libsfml-graphics.so android/app/src/main/jniLibs/arm64-v8a/
          cp build-android/vcpkg_installed/arm64-android/lib/libsfml-window.so android/app/src/main/jniLibs/arm64-v8a/
          cp build-android/vcpkg_installed/arm64-android/lib/libsfml-system.so android/app/src/main/jniLibs/arm64-v8a/
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" android/app/src/main/jniLibs/arm64-v8a/libmain.so

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonLauncher-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
